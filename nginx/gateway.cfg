global
  log stdout format raw local0 info

defaults
  mode               http
  log                global
  timeout connect    10s
  timeout client     300s
  timeout server     300s

frontend  fe_main
  bind :80           # direct HTTP access
  default_backend    blue_green

backend blue_green
  mode http
  balance          first
  # green nginx
  server s1        172.20.0.10:80 check
  # blue nginx
  server s2        172.20.0.11:80 check backup
